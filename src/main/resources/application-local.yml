spring:
  datasource:
    url: jdbc:h2:mem:algolog;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration/h2

logging:
  level:
    org.hibernate.SQL: debug

algolog:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-key-for-algolog}
