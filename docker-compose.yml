services:
  mysql:
    image: mysql:8.4
    container_name: algolog-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: algolog
      MYSQL_USER: algolog
      MYSQL_PASSWORD: algolog
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
